<svg xmlns="http://www.w3.org/2000/svg" width="780" height="240" viewBox="0 0 780 240" role="img" aria-labelledby="title desc">
<title id="title">C4 disjoint union K2</title>
<desc id="desc">A separate edge joins x0 and x1. A four-cycle joins x2 to x3 to x4 to x5 to x2.</desc>
<rect width="780" height="240" rx="12" fill="#f6f8fa"/>
<g stroke="#57606a" stroke-width="4" fill="none"><path d="M90 110H230"/><path d="M450 65H650V175H450Z"/></g>
<g stroke="white" stroke-width="3">
<g fill="#8250df"><circle cx="90" cy="110" r="21"/><circle cx="230" cy="110" r="21"/></g>
<g fill="#1a7f37"><circle cx="450" cy="65" r="21"/><circle cx="650" cy="175" r="21"/></g>
<g fill="#0969da"><circle cx="650" cy="65" r="21"/><circle cx="450" cy="175" r="21"/></g></g>
<g font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#24292f">
<text x="90" y="153">x0</text><text x="230" y="153">x1</text>
<text x="450" y="31">x2</text><text x="650" y="31">x3</text>
<text x="650" y="217">x4</text><text x="450" y="217">x5</text>
<text x="160" y="206" font-weight="bold">K2</text><text x="550" y="127" font-weight="bold">C4</text>
<text x="335" y="119" font-size="30">+</text></g>
</svg>
